<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="seamlessTriangles" width="40" height="34.64" patternUnits="userSpaceOnUse">
      <!-- Triângulo apontando para cima -->
      <polygon points="20,0 40,34.64 0,34.64" fill="#a3d5f7" />
      <!-- Triângulo apontando para baixo (preenche os espaços) -->
      <polygon points="20,34.64 40,0 0,0" fill="#cceeff" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#seamlessTriangles)" />
</svg>
