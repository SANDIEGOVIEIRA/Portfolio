<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="zigzagPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Retângulo inclinado para direita -->
      <polygon points="0,10 30,10 40,30 10,30" fill="#cceeff" />
      <!-- Retângulo inclinado para esquerda -->
      <polygon points="10,10 40,10 30,30 0,30" fill="#a3d5f7" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#zigzagPattern)" />
</svg>
